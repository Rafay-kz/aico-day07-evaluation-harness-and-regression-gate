# AICO Day 3 model routing
# NO SECRETS belong in this file.
#
# Endpoint and identity stay in the environment (.env, never committed).
# Chat alias is a lead-provided placeholder until a live chat smoke test is required.

version: "1.0"

foundry:
  endpoint_env: "AICO_FOUNDRY_ENDPOINT"

models:
  chat:
    alias: "gpt-4.1-mini"
  embedding:
    alias: "text-embedding-3-small"

resilience:
  timeout_seconds: 20
  retry:
    max_attempts: 3
    base_delay_ms: 250
    max_delay_ms: 2000
    jitter: true

budgets:
  chat:
    max_input_tokens: 8000
    max_output_tokens: 1000
  embedding:
    max_items_per_call: 32

routing:
  primary:
    provider: "microsoft-foundry"
    region: "__LEAD_PROVIDED_REGION__"
    data_boundary: "__LEAD_PROVIDED_DATA_BOUNDARY__"
    risk_class: "standard"
  fallback:
    enabled: false
    provider: "__OPTIONAL_APPROVED_PROVIDER__"
    region: "__OPTIONAL_APPROVED_REGION__"
    data_boundary: "__OPTIONAL_APPROVED_DATA_BOUNDARY__"
    risk_class: "standard"
    require_compatibility:
      provider: true
      region: true
      data_boundary: true
      risk: true
      budget: true
